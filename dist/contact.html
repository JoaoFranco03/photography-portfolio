<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armstrong Peterson - Contact</title>
  <meta name="description" content="Get in touch with Armstrong Peterson for photography sessions.">

  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
  <link rel="stylesheet" href="../styles.css" />
  <script defer src="../script.js"></script>
  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4rem;
      align-items: start;
      margin: 4rem 0;
    }

    @media (min-width: 900px) {
      .contact-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-input.has-error,
    .form-textarea.has-error {
      border-color: #ef4444;
      background-color: rgba(239, 68, 68, 0.05);
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container nav-container">
      <a href="../index.html" class="logo">Armstrong Peterson</a>

      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>

      <nav class="nav-menu" id="navMenu">
        <ul class="nav-links">
          <li><a href="../index.html">Portfolio</a></li>
          <li><a href="about_me.html">About Me</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="container animate-on-scroll">
      <h1 class="text-center">CONTACT</h1>

      <div class="contact-grid">
        <!-- Form Section -->
        <div class="card-expressive delay-100 animate-on-scroll">
          <form id="contactForm" action="https://formspree.io/f/mwprbnyl" method="POST">
            <!-- Success Message -->
            <div id="successMessage" class="form-alert success">
              Success! Your message has been sent. I'll get back to you soon!
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="form-alert error">
              Error! There was a problem sending your message. Please try again.
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Your email</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="your.email@gmail.com"
                required />
            </div>

            <div class="form-group">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" id="subject" name="subject" class="form-input"
                placeholder="Let me know how I can help you" required />
            </div>

            <div class="form-group">
              <label for="message" class="form-label">Your message</label>
              <textarea id="message" name="message" rows="5" class="form-textarea"
                placeholder="Tell me about your photography needs..." required></textarea>
            </div>

            <!-- Hidden field for form identification -->
            <input type="hidden" name="_subject" value="New Contact Form Submission from Photography Portfolio">

            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">
              <span id="submitText">Send Message</span>
              <span id="loadingText" style="display: none;">Sending...</span>
            </button>
          </form>
        </div>

        <!-- Image Section -->
        <div class="card-expressive rotate-left delay-200 animate-on-scroll" style="padding: 1rem;">
          <img src="../src/images/contact-photo.jpg" alt="Armstrong Peterson Photography"
            style="width: 100%; height: auto; border-radius: var(--radius-sm); object-fit: cover; aspect-ratio: 1/1;" />
        </div>
      </div>
    </section>
  </main>

      <h3 class="font-heavy text-accent">Armstrong Peterson</h3>
      <p style="opacity: 0.6; margin-bottom: 0;">Through the lens &amp; out of the box.</p>

  <!-- Contact Form JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('contactForm');
      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const loadingText = document.getElementById('loadingText');
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        // Show loading state
        submitBtn.disabled = true;
        submitText.style.display = 'none';
        loadingText.style.display = 'inline';

        // Hide previous messages
        successMessage.style.display = 'none';
        errorMessage.style.display = 'none';

        const formData = new FormData(form);

        try {
          const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            successMessage.style.display = 'block';
            form.reset();
            successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            throw new Error('Form submission failed');
          }
        } catch (error) {
          errorMessage.style.display = 'block';
          errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } finally {
          submitBtn.disabled = false;
          submitText.style.display = 'inline';
          loadingText.style.display = 'none';
        }
      });

      // Real-time validation feedback
      const inputs = form.querySelectorAll('input[required], textarea[required]');
      inputs.forEach(input => {
        input.addEventListener('blur', function () {
          if (this.value.trim() === '') {
            this.classList.add('has-error');
          } else {
            this.classList.remove('has-error');
          }
        });
      });

      const emailInput = document.getElementById('email');
      emailInput.addEventListener('blur', function () {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (this.value && !emailRegex.test(this.value)) {
          this.classList.add('has-error');
        }
      });
    });
  </script>
</body>
